name: Preparar clips

on:
  schedule:
    - cron: "15 */3 * * *"   # de 3 em 3 horas procura clips novos
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teste: só gerar vídeos (sem Telegram) e guardá-los para download"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clipbot-state
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-render.txt

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Procurar, editar e enviar clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m clipbot prepare ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Guardar vídeos de teste
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-teste
          path: output/*.mp4
          if-no-files-found: warn

      - name: Guardar estado
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "estado: novos clips"
            git pull -q --rebase && git push -q
          fi
