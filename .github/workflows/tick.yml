name: Aprovar e publicar

on:
  schedule:
    - cron: "*/20 * * * *"   # de 20 em 20 min: lê os botões do Telegram e publica nas horas marcadas
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publicar já o próximo vídeo aprovado (sem esperar pelo horário)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # o comando /clips do Telegram inicia o workflow "Preparar clips"

concurrency:
  group: clipbot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ler aprovações e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m clipbot tick ${{ inputs.publish_now && '--publish-now' || '' }}

      - name: Guardar estado
        run: python -m clipbot.savestate 'estado - aprovações/publicações'
