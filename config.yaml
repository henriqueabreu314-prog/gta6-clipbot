# ============================================================
#  GTA 6 Clip Bot - configuração
#  Podes editar este ficheiro diretamente no site do GitHub.
# ============================================================

# Streamers a seguir, por plataforma (o nome que aparece no link).
#   Twitch: twitch.tv/NOME      Kick: kick.com/NOME
# IMPORTANTE: usa só streamers que AUTORIZAM clips do canal deles
# (campanhas de clippers no Whop "Content Rewards", programa de
# clipping da Kick, regras no painel do canal). Assim evitas strikes.
# Deixa a lista vazia ([]) se não usares uma plataforma.
streamers:
  twitch:
    - ohnepixel
    - xqc
    - kaicenat
    - summit1g
    - sodapoppin
    - moistcr1tikal
    - jynxzi
    - caseoh_
    - zackrawrr
    - lacy
    - hasanabi
    - ishowspeed
  kick:
    - n3on
    - xqc
    - theburntpeanut
    - adinross

# Jogo(s) a procurar (nome da categoria na Twitch / Kick).
games:
  - "Grand Theft Auto VI"
  - "GTA VI"

# true  = o bot manda-te cada vídeo para o Telegram com ✅/❌ e só publica os aprovados (opção A)
# false = tudo automático, sem perguntar (opção B)
approval: true

# Procura de clips
search:
  lookback_hours: 168     # procurar clips criados nas últimas X horas (168 = 7 dias, 720 = 30 dias)
  min_views: 100          # ignorar clips com menos visualizações (mais alto = só os mais virais)
  min_duration: 8         # segundos
  max_waiting: 60         # máximo de vídeos à espera (por aprovar + na fila)
  per_run: 10             # máximo de clips novos editados em cada procura (cada um demora ~2-3 min)
  time_budget_min: 60     # a procura pára de começar clips novos ao fim de X minutos (o GitHub corta aos 90)
  expire_hours: 48        # vídeos por aprovar há mais de X horas expiram e dão lugar a novos

# Horários de publicação, no fuso horário abaixo.
# Para público internacional/EUA, a hora de Nova Iorque costuma ser a melhor referência.
schedule:
  timezone: "America/New_York"
  slots: ["12:30", "17:30", "20:30"]

# Marca de água do TEU canal
watermark:
  text: "@ViceCityMoments_G_VI"   # o teu @; "" = sem marca de água
  logo: ""                # opcional: caminho de um PNG no repositório, ex: "assets/logo.png"
  opacity: 0.6            # 0 = invisível, 1 = opaco
  position: "top-right"   # top-left / top-right / bottom-left / bottom-right

# Legendas automáticas (Whisper)
whisper:
  model: "small"          # tiny / base / small (maior = melhor mas mais lento)
  language: "en"          # null = deteção automática

# Títulos escritos por IA (Google Gemini, grátis). Precisa do secret GEMINI_API_KEY.
# Sem a chave, ou se falhar, usa o título original do clip.
titles:
  enabled: true
  model: "gemini-flash-latest"   # se não existir, o bot escolhe sozinho outro modelo flash

# Textos. Variáveis: {hook} {streamer} {url} {channel_url}
text:
  hook_max_chars: 70
  hook_fallback: "GTA 6 moment 😳"
  youtube_title: "{hook} | {streamer} #GTA6 #shorts"
  description: |
    🎮 Clip from {streamer} – {channel_url}
    🔗 Original clip: {url}

    All credit to {streamer}. Go follow them!

    #GTA6 #GTAVI #GrandTheftAuto #gaming #shorts
  tiktok_caption: "{hook} 🎮 Credit: {channel_url} #GTA6 #GTAVI #gaming #fyp"
  tags: ["GTA 6", "GTA VI", "Grand Theft Auto VI", "GTA 6 clips", "gaming", "shorts"]

# Plataformas. Só funcionam depois de configurares as chaves (ver README).
youtube:
  enabled: true
  privacy: "public"       # até a app passar a auditoria da Google, o YouTube força "private"
  category_id: "20"       # 20 = Gaming

tiktok:
  enabled: false
  privacy: "SELF_ONLY"    # apps não auditadas pelo TikTok só podem usar SELF_ONLY (privado)
